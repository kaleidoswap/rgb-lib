name: Format code

on:
  push:
    branches: [ "utexo-master", "dev", "stage", "master", "ks/dev" ]
  pull_request:
    branches: [ "utexo-master", "dev", "stage", "master", "ks/dev" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","kaleido-maker-ci"]') || 'ubuntu-latest' }}
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - name: Install build and formatting prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git pkg-config libssl-dev clang clang-format cmake
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check --config format_code_in_doc_comments=true
      - name: Format c-ffi bindings
        working-directory: ./bindings/c-ffi
        run: |
          make format
          git diff --exit-code
      - name: Format uniffi bindings
        working-directory: ./bindings/uniffi
        run: cargo fmt -- --check
